name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-Linux-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install dependencies
      run: |
        GCC_VERSION=$(sed -nE 's/^set\(DEFAULT_GCC_VERSION ([0-9]+)\)$/\1/p' CMakeLists.txt)
        [[ $GCC_VERSION =~ ^[0-9]+$ ]]
        sudo apt update
        sudo apt install -f flex bison libboost-all-dev ninja-build
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew update
        brew install "gcc@${GCC_VERSION}"
        GCC_PREFIX=$(brew --prefix "gcc@${GCC_VERSION}")
        test -x "$GCC_PREFIX/bin/gcc-${GCC_VERSION}"
        test -x "$GCC_PREFIX/bin/g++-${GCC_VERSION}"
        GCC="$GCC_PREFIX/bin/gcc-${GCC_VERSION}"
        ATOMIC_LIBRARY=$("$GCC" -print-file-name=libatomic.a)
        test -f "$ATOMIC_LIBRARY"
        ATOMIC_ASNEEDED="${ATOMIC_LIBRARY%/*}/libatomic_asneeded.a"
        [[ -e "$ATOMIC_ASNEEDED" || -L "$ATOMIC_ASNEEDED" ]] || ln -s "$ATOMIC_LIBRARY" "$ATOMIC_ASNEEDED"
        printf 'int main(void) { return 0; }\n' | "$GCC" -flto -fuse-linker-plugin -x c - -o /tmp/gcc-lto-check
        echo "$GCC_PREFIX/bin" >> "$GITHUB_PATH"

    - name: Build Release
      run: cmake --workflow release

    - name: Test
      run: cmake --workflow test

    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: verifypn-linux64
        path: '${{github.workspace}}/build-release/verifypn/bin/verifypn-linux64'
